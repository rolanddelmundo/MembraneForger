site_name: MembraneForger
site_description: Build validated all-atom membrane-protein systems for GROMACS from one structure file
site_url: https://membraneforger.github.io/
repo_url: https://github.com/rolanddelmundo/MembraneForger
repo_name: rolanddelmundo/MembraneForger
edit_uri: edit/main/membraneforger/docs/
docs_dir: membraneforger/docs   # the same Markdown files the README links to; nothing is copied

theme:
  name: material
  custom_dir: membraneforger/docs/overrides
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - navigation.tabs
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    scheme: default
    primary: white
    accent: teal

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Your first build: first_build.md
      - Preparing the input: preparing_inputs.md
      - Ligands: ligands.md
  - Guides:
      - Examples and recipes: examples.md
      - Equilibration: equilibration.md
      - Troubleshooting: troubleshooting.md
      - Questions: faq.md
  - Validation:
      - validation/index.md
      - Inputs: validation/inputs.md
      - Placement and slicing: validation/placement.md
      - Backmapping and assembly: validation/backmapping.md
      - Membrane quality checks: validation/membrane.md
      - Integrity checks and gates: validation/integrity.md
      - Thresholds: validation/thresholds.md
      - Limitations and settings: validation/limitations.md
  - Reference:
      - Command line: cli_reference.md
      - Output files: outputs.md
      - Advanced options: advanced.md
      - Module map: modules.md
      - Changelog: https://github.com/rolanddelmundo/MembraneForger/blob/main/membraneforger/CHANGELOG.md
  - About: about.md

not_in_nav: |
  /membraneforger_tutorial.md

extra_css:
  - assets/home.css
  - assets/site.css

extra_javascript:
  - assets/home.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - md_in_html
