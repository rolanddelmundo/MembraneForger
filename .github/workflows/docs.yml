name: docs

on:
  push:
    branches: [main]
    paths:
      - "membraneforger/docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "membraneforger/docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: Build (broken links fail the build)
        run: mkdocs build --strict

  publish:
    # The site is served from membraneforger/membraneforger.github.io, whose workflow builds these docs from main.
    # This job asks it to rebuild. SITE_DISPATCH_TOKEN is a fine-grained token with Contents read/write on that repo.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a rebuild of membraneforger.github.io
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set; the site rebuilds on its daily schedule instead."
            exit 0
          fi
          gh api -X POST repos/membraneforger/membraneforger.github.io/dispatches -f event_type=docs-updated
