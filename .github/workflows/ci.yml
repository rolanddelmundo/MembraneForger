name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lightweight:
    runs-on: ubuntu-latest
    env:
      MEMBRANEFORGER_CACHE_DIR: /tmp/membraneforger-cache

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install open runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dssp gromacs
          command -v mkdssp

      - name: Install pinned Python test dependencies
        run: python -m pip install pytest==8.2.2 numpy==1.26.4 pandas==2.2.2 pyyaml==6.0.2 cython==3.0.10 vermouth==0.15.0

      - name: Shell syntax
        run: |
          bash -n setup.sh
          bash -n run_pipeline.sh
          find stages -type f -name '*.sh' -exec bash -n {} \;

      - name: Python syntax
        run: python -m compileall -q scripts stages tests

      - name: Public tests
        env:
          MEMBRANEFORGER_DISABLE_NETWORK_TESTS: "1"
        run: python -m pytest -q

      - name: Public vendored-source setup verification
        run: |
          rm -rf "$MEMBRANEFORGER_CACHE_DIR"
          bash setup.sh --verify | tee setup-verify.txt
          grep -F "repository/vendor" setup-verify.txt
          grep -F "INSANE bundled exact script" setup-verify.txt
          grep -F "external-cache-built" setup-verify.txt

      - name: Public setup dependency check
        run: bash setup.sh --check

      - name: Public static workflow check
        run: bash run_pipeline.sh --check

      - name: Resource bootstrap checks
        run: |
          python scripts/bootstrap_resources.py --component martini --verify
          python scripts/bootstrap_resources.py --component mstool --verify

      - name: Public default dry-run
        env:
          ROSETTA_BIN: ""
          ROSETTA_DATABASE: ""
          PYROSETTA_PYTHON: ""
          MOLFILE_TO_PARAMS: ""
          MEMBRANEFORGER_CHARMM36_ROOT: ""
          MEMBRANEFORGER_MEMBRANE_TOPPAR: ""
          MEMBRANEFORGER_CGENFF_ROOT: ""
          MEMBRANEFORGER_LIGAND_PARAMS_ROOT: ""
        run: bash run_pipeline.sh dry-run --config config/workflow.yaml

      - name: Missing CHARMM resources fail clearly
        env:
          MEMBRANEFORGER_CHARMM36_ROOT: ""
          MEMBRANEFORGER_MEMBRANE_TOPPAR: ""
        run: |
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/stage4-required.yaml" <<'YAML'
          stage4:
            charmm36_required: true
            membrane_toppar_required: true
            resources:
              charmm36_forcefield: resources/external/charmm36.ff
              membrane_toppar: resources/forcefields/charmm36/toppar
          YAML
          if bash run_pipeline.sh validate --config "$tmpdir/stage4-required.yaml" >"$tmpdir/out.txt" 2>"$tmpdir/err.txt"; then
            echo "expected missing CHARMM resources to block Stage 4" >&2
            exit 1
          fi
          grep -E "CHARMM36 GROMACS|CHARMM resource|membrane topology/parameter" "$tmpdir/err.txt"

      - name: Public staged dry-run smoke
        env:
          ROSETTA_BIN: ""
          ROSETTA_DATABASE: ""
          PYROSETTA_PYTHON: ""
          MOLFILE_TO_PARAMS: ""
          MEMBRANEFORGER_CHARMM36_ROOT: ""
          MEMBRANEFORGER_MEMBRANE_TOPPAR: ""
          MEMBRANEFORGER_CGENFF_ROOT: ""
          MEMBRANEFORGER_LIGAND_PARAMS_ROOT: ""
        run: |
          tmpdir="$(mktemp -d)"
          cache="$tmpdir/cache with spaces"
          MEMBRANEFORGER_CACHE_DIR="$cache" "$PWD/run_pipeline.sh" --pdb "$PWD/examples/minimal/inputs/minimal.pdb" --config "$PWD/config/workflow.example.yaml" --output-dir "$tmpdir/output path" --dry-run
